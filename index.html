
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d19">
<title>PRO GENIUS BATTLE</title>
<style>
:root{--bg:#070b14;--panel:#101a2b;--cyan:#00e5ff;--purple:#9b5cff;--text:#f4f7ff;--muted:#9eacc5;--border:#263953}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#14233e,#080d19 55%,#05070d);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{width:min(100%,560px);margin:auto;padding:22px 16px 90px}
.brand{text-align:center;margin:8px 0 22px}
.logo{width:66px;height:66px;margin:auto;border:2px solid var(--cyan);border-radius:20px;display:grid;place-items:center;font-size:31px;box-shadow:0 0 25px #00e5ff38;background:#0d1b2e}
.brand h1{font-size:clamp(23px,6vw,32px);margin:12px 0 4px;letter-spacing:1px;color:var(--cyan);text-shadow:0 0 16px #00e5ff44}
.brand p{margin:0;color:var(--muted);font-size:12px;letter-spacing:3px}
.card{background:linear-gradient(145deg,#111d30f5,#0b1322f5);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 16px 40px #0005}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#080e19;border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;margin-bottom:22px}
.tabs button{border:0;border-radius:9px;padding:11px;color:var(--muted);background:transparent;font-weight:700}
.tabs button.active{background:var(--cyan);color:#04101b}
.field{display:block;margin:13px 0}
.field span{display:block;font-size:13px;color:#d7e2f6;margin-bottom:7px}
.field input,.field select{width:100%;background:#080f1c;border:1px solid #2b405c;border-radius:11px;padding:13px;color:white;outline:none}
.field input:focus,.field select:focus{border-color:var(--cyan)}
.primary{width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(90deg,var(--cyan),#68a9ff);color:#05101b;font-weight:900;margin-top:10px}
.hint,.muted{font-size:12px;color:var(--muted);line-height:1.6}
.notice{font-size:13px;padding:11px;border-radius:10px;margin:12px 0;display:none}
.notice.error{display:block;background:#421d2a;color:#ffb8c4}
.notice.ok{display:block;background:#10392f;color:#9dffdf}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.smallbrand{font-weight:900;color:var(--cyan);font-size:15px}
.pill{border:1px solid var(--border);background:#111c2e;color:#c8d5eb;padding:8px 10px;border-radius:10px;font-size:12px}
.welcome h2{margin:0 0 5px;font-size:25px}
.welcome p{margin:0;color:var(--muted);font-size:13px}
.coins{margin:18px 0;background:linear-gradient(110deg,#172e49,#252044);border:1px solid #3a4c70;border-radius:16px;padding:17px;display:flex;align-items:center;justify-content:space-between}
.coins strong{font-size:25px;color:#ffd66b}
.coins span{font-size:12px;color:var(--muted)}
.section-title{font-size:16px;margin:22px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.tile{background:linear-gradient(145deg,#14233a,#0c1524);border:1px solid var(--border);border-radius:15px;padding:16px 13px;text-align:left;color:white;min-height:108px}
.tile .emoji{font-size:25px;display:block;margin-bottom:9px}
.tile strong{display:block;font-size:14px}
.tile small{display:block;color:var(--muted);margin-top:4px;font-size:11px}
.panel{background:#0c1524;border:1px solid var(--border);border-radius:15px;padding:16px;margin-top:12px}
.panel p{color:var(--muted);font-size:13px;line-height:1.5}
.back{background:none;border:0;color:var(--cyan);padding:0;margin:0 0 16px;font-weight:700}
.listrow{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #223149;font-size:13px}
.listrow:last-child{border-bottom:0}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#080d19f2;border-top:1px solid var(--border);display:flex;justify-content:center;gap:clamp(12px,5vw,28px);padding:10px 6px calc(10px + env(safe-area-inset-bottom))}
.bottom button{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:46px}
.bottom button b{font-size:19px;font-weight:500}
.bottom button.active{color:var(--cyan)}
.footer{text-align:center;color:#64738d;font-size:11px;margin-top:20px}
@media(min-width:500px){.wrap{padding-top:32px}.card{padding:26px}}
</style>
</head>
<body>
<main class="wrap">
<section id="authScreen">
<header class="brand">
<div class="logo">⚔️</div>
<h1>PRO GENIUS BATTLE</h1>
<p>YOUR BATTLE. YOUR GLORY.</p>
</header>

<div class="card">
<div class="tabs">
<button id="loginTab" class="active" onclick="showAuth('login')">LOGIN</button>
<button id="registerTab" onclick="showAuth('register')">REGISTER</button>
</div>

<div id="message" class="notice"></div>

<form id="loginForm">
<label class="field"><span>Email</span>
<input id="loginEmail" type="email" autocomplete="email" placeholder="Enter your email" required></label>
<label class="field"><span>Password</span>
<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6"></label>
<button class="primary" type="submit">LOGIN TO THE BATTLE →</button>
<p class="hint">Already registered? Sign in. New player? Choose Register above.</p>
</form>

<form id="registerForm" class="hidden">
<label class="field"><span>App username</span>
<input id="regUsername" maxlength="24" placeholder="Choose a username" required></label>
<label class="field"><span>Email</span>
<input id="regEmail" type="email" autocomplete="email" placeholder="Enter your email" required></label>
<label class="field"><span>Password (minimum 6 characters)</span>
<input id="regPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Create a password" required></label>
<label class="field"><span>Game</span>
<select id="regGame"><option>Free Fire</option><option>PUBG Mobile</option><option>BGMI</option></select></label>
<label class="field"><span>Player UID / Game ID</span>
<input id="regUid" maxlength="40" placeholder="Enter your game UID" required></label>
<label class="field"><span>Team name (optional)</span>
<input id="regTeam" maxlength="30" placeholder="Your team name"></label>
<button class="primary" type="submit">CREATE PLAYER ACCOUNT →</button>
<p class="hint">Demo preview only. Real secure accounts require Firebase setup.</p>
</form>
</div>
<p class="footer">NEON GAMING • TOURNAMENTS • COMMUNITY</p>
</section>

<section id="appScreen" class="hidden">
<div class="topline">
<div class="smallbrand">⚔ PRO GENIUS BATTLE</div>
<button class="pill" onclick="logout()">LOG OUT ↗</button>
</div>
<div id="pageContent"></div>
</section>
</main>

<nav id="bottomNav" class="bottom hidden">
<button class="active" data-page="home" onclick="openPage('home',this)"><b>⌂</b>Home</button>
<button data-page="tournaments" onclick="openPage('tournaments',this)"><b>⚔</b>Tournaments</button>
<button data-page="matches" onclick="openPage('matches',this)"><b>▣</b>Matches</button>
<button data-page="messages" onclick="openPage('messages',this)"><b>✉</b>Messages</button>
<button data-page="profile" onclick="openPage('profile',this)"><b>♙</b>Profile</button>
</nav>

<script>
const $=id=>document.getElementById(id);
let currentUser=null;

function showMessage(text,type='error'){
 const m=$('message');
 m.textContent=text;
 m.className='notice '+type;
}
function showAuth(which){
 $('message').className='notice';
 const isLogin=which==='login';
 $('loginForm').classList.toggle('hidden',!isLogin);
 $('registerForm').classList.toggle('hidden',isLogin);
 $('loginTab').classList.toggle('active',isLogin);
 $('registerTab').classList.toggle('active',!isLogin);
}
function getUsers(){
 try{return JSON.parse(localStorage.getItem('pgb_preview_users')||'[]')}
 catch(e){return []}
}
function setUsers(users){
 localStorage.setItem('pgb_preview_users',JSON.stringify(users));
}
function enterApp(user){
 currentUser=user;
 $('authScreen').classList.add('hidden');
 $('appScreen').classList.remove('hidden');
 $('bottomNav').classList.remove('hidden');
 openPage('home',document.querySelector('[data-page="home"]'));
}
$('registerForm').addEventListener('submit',e=>{
 e.preventDefault();
 const username=$('regUsername').value.trim();
 const email=$('regEmail').value.trim().toLowerCase();
 const password=$('regPassword').value;
 const uid=$('regUid').value.trim();
 if(password.length<6){
  showMessage('Password must be at least 6 characters.');
  return;
 }
 const users=getUsers();
 if(users.some(u=>u.email===email)){
  showMessage('This email is already registered in this preview. Please log in.');
  return;
 }
 const user={
  username,email,game:$('regGame').value,uid,
  team:$('regTeam').value.trim(),coins:0,
  created:new Date().toISOString()
 };
 // Preview only: password is not stored.
 users.push(user);
 setUsers(users);
 sessionStorage.setItem('pgb_preview_session',email);
 enterApp(user);
});
$('loginForm').addEventListener('submit',e=>{
 e.preventDefault();
 const email=$('loginEmail').value.trim().toLowerCase();
 const user=getUsers().find(u=>u.email===email);
 if(!user){
  showMessage('No preview profile found. Register first. Real login requires Firebase.');
  return;
 }
 sessionStorage.setItem('pgb_preview_session',email);
 enterApp(user);
});
function logout(){
 currentUser=null;
 sessionStorage.removeItem('pgb_preview_session');
 $('appScreen').classList.add('hidden');
 $('bottomNav').classList.add('hidden');
 $('authScreen').classList.remove('hidden');
 showAuth('login');
}
function openPage(page,el){
 document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b===el));
 const c=$('pageContent');
 if(!currentUser){logout();return}
 const header=`<div class="welcome"><h2>Welcome, ${escapeHtml(currentUser.username)} 👋</h2><p>Your next battle starts here.</p></div>
 <div class="coins"><div><span>YOUR COIN BALANCE</span><br><strong>🪙 ${Number(currentUser.coins||0)}</strong></div><span>PLAYER WALLET</span></div>`;
 const tile=(emoji,title,sub,target)=>`<button class="tile" onclick="openPage('${target}',document.querySelector('[data-page=\\'${target}\\']'))"><span class="emoji">${emoji}</span><strong>${title}</strong><small>${sub}</small></button>`;
 if(page==='home'){
  c.innerHTML=header+`<h3 class="section-title">Battle Arena</h3><div class="grid">
  ${tile('⚔️','Tournaments','Free & paid events','tournaments')}
  ${tile('🎯','Matches','Upcoming & ongoing','matches')}
  ${tile('💳','Payments','EasyPaisa / JazzCash','payments')}
  ${tile('💬','Messages','Community & admin','messages')}
  ${tile('🏆','Leaderboard','Kills, points & rank','leaderboard')}
  ${tile('👤','My Profile','UID and player data','profile')}
  </div><div class="panel"><strong>📢 Announcements</strong><p>Tournament announcements will appear here after database setup.</p></div>
  <p class="hint">Preview mode: data is saved only in this browser. Real shared accounts, payments, chat and admin controls need secure backend setup.</p>`;
 }else if(page==='tournaments'){
  c.innerHTML=`<button class="back" onclick="openPage('home',document.querySelector('[data-page=home]'))">← Back</button><h2>Tournaments</h2>
  <div class="panel"><strong>🟢 Free Tournament</strong><p>Entry fee: Free • Registration opens when admin publishes an event.</p><button class="primary" onclick="alert('Online registration requires database setup.')">VIEW / REGISTER</button></div>
  <div class="panel"><strong>🟣 Paid Tournament</strong><p>Entry fee and prize details will be set by the admin.</p><button class="primary" onclick="openPage('payments',null)">PAYMENT OPTIONS</button></div>`;
 }else if(page==='matches'){
  c.innerHTML=`<button class="back" onclick="openPage('home',document.querySelector('[data-page=home]'))">← Back</button><h2>Matches</h2>
  <div class="panel"><strong>⏳ Upcoming Matches</strong><p>Match schedule and room details will appear here.</p></div>
  <div class="panel"><strong>🔴 Ongoing Matches</strong><p>Live match status will appear here.</p></div>
  <div class="panel"><strong>✅ Completed Matches</strong><p>Verified kills, placements and points will appear here.</p></div>`;
 }else if(page==='payments'){
  c.innerHTML=`<button class="back" onclick="openPage('home',document.querySelector('[data-page=home]'))">← Back</button><h2>Payments</h2>
  <div class="panel"><strong>🟢 EasyPaisa</strong><p>Authorized payment details will be added by the owner.</p></div>
  <div class="panel"><strong>🟠 JazzCash</strong><p>Authorized payment details will be added by the owner.</p></div>
  <div class="panel"><strong>Submit payment proof</strong><p>Payment reference submission requires secure backend setup.</p></div>`;
 }else if(page==='messages'){
  c.innerHTML=`<button class="back" onclick="openPage('home',document.querySelector('[data-page=home]'))">← Back</button><h2>Messages</h2>
  <div class="panel"><strong>📣 Admin Announcements</strong><p>Official notices from tournament admins.</p></div>
  <div class="panel"><strong>💬 Player Chat</strong><p>Shared online chat requires a database connection.</p></div>`;
 }else if(page==='leaderboard'){
  c.innerHTML=`<button class="back" onclick="openPage('home',document.querySelector('[data-page=home]'))">← Back</button><h2>🏆 Leaderboard</h2>
  <div class="panel"><div class="listrow"><strong>Rank / Player</strong><strong>Kills / Points</strong></div><div class="listrow"><span>Results not published yet</span><span>—</span></div><p>Admins will enter match kills and placements after backend setup.</p></div>`;
 }else if(page==='profile'){
  c.innerHTML=`<button class="back" onclick="openPage('home',document.querySelector('[data-page=home]'))">← Back</button><h2>My Player Profile</h2>
  <div class="panel">${row('Username',currentUser.username)}${row('Email',currentUser.email)}${row('Game',currentUser.game)}${row('Player UID',currentUser.uid)}${row('Team',currentUser.team||'Not set')}${row('Coins',currentUser.coins||0)}</div>
  <p class="hint">Never share your password, payment PIN or OTP.</p>`;
 }
}
function row(k,v){
 return `<div class="listrow"><span>${escapeHtml(String(k))}</span><strong>${escapeHtml(String(v))}</strong></div>`;
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const savedEmail=sessionStorage.getItem('pgb_preview_session');
if(savedEmail){
 const saved=getUsers().find(u=>u.email===savedEmail);
 if(saved)enterApp(saved);
}
</script>
</body>
  </html>
