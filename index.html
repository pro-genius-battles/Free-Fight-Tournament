
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d19">
<title>PRO GENIUS BATTLE</title>
<style>
:root {
  --bg:#070b14;
  --panel:#101a2b;
  --cyan:#00e5ff;
  --purple:#9b5cff;
  --text:#f4f7ff;
  --muted:#9eacc5;
  --border:#263953;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:radial-gradient(ellipse at top,#14233e,#080d19 55%,#05070d);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}
button,input,select { font:inherit; }
button { cursor:pointer; }
.hidden { display:none!important; }
.wrap { width:min(100%,560px); margin:auto; padding:22px 16px 90px; }
.brand { text-align:center; margin:8px 0 22px; }
.logo {
  width:66px;height:66px;margin:auto;border:2px solid var(--cyan);
  border-radius:20px;display:grid;place-items:center;font-size:31px;
  box-shadow:0 0 25px #00e5ff38;background:#0d1b2e;
}
.brand h1 { font-size:clamp(23px,6vw,32px);margin:12px 0 4px;color:var(--cyan); }
.brand p { color:var(--muted);font-size:12px;letter-spacing:3px; }
.card,.panel {
  background:linear-gradient(145deg,#111d30f5,#0b1322f5);
  border:1px solid var(--border);border-radius:18px;padding:20px;margin:12px 0;
}
.tabs { display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:18px; }
.tabs button,.secondary {
  padding:12px;border:1px solid var(--border);border-radius:10px;
  background:#080e19;color:var(--muted);
}
.tabs button.active { background:var(--cyan);color:#04101b; }
.field { display:block;margin:13px 0; }
.field span { display:block;font-size:13px;margin-bottom:7px;color:#d7e2f6; }
.field input,.field select {
  width:100%;background:#080f1c;border:1px solid #2b405c;
  border-radius:11px;padding:13px;color:white;
}
.primary {
  width:100%;border:0;border-radius:12px;padding:14px;
  background:linear-gradient(90deg,var(--cyan),#68a9ff);
  color:#05101b;font-weight:900;margin-top:10px;
}
.secondary { width:100%;margin-top:8px; }
.notice { display:none;padding:11px;border-radius:10px;margin:12px 0;font-size:13px; }
.notice.error { display:block;background:#421d2a;color:#ffb8c4; }
.notice.ok { display:block;background:#10392f;color:#9dffdf; }
.hint,.muted { font-size:12px;color:var(--muted);line-height:1.6; }
.topline { display:flex;justify-content:space-between;align-items:center;gap:8px; }
.smallbrand { font-weight:900;color:var(--cyan);font-size:14px; }
.pill { background:#111c2e;color:white;border:1px solid var(--border);padding:9px;border-radius:9px; }
.welcome h2 { font-size:24px;margin-bottom:5px; }
.welcome p { color:var(--muted);font-size:13px; }
.coins { background:#172e49;border:1px solid #3a4c70;border-radius:14px;padding:16px;margin:16px 0; }
.coins strong { font-size:24px;color:#ffd66b; }
.grid { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
.tile { background:#122039;border:1px solid var(--border);border-radius:14px;padding:16px 12px;text-align:left;color:white;min-height:100px; }
.tile b { display:block;margin:8px 0; }
.tile small { color:var(--muted); }
.section-title { margin-top:24px; }
.listrow { display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #223149;font-size:13px;overflow-wrap:anywhere; }
.bottom {
  position:fixed;bottom:0;left:0;right:0;background:#080d19f5;
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  padding:10px 4px calc(10px + env(safe-area-inset-bottom));
}
.bottom button { background:none;border:0;color:var(--muted);font-size:11px; }
.bottom button.active { color:var(--cyan); }
.footer { text-align:center;color:#64738d;font-size:11px;margin-top:20px; }
.avatar { width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);display:block;margin:0 auto 12px;background:#0d1b2e; }
</style>
</head>
<body>
<main class="wrap">

<section id="authScreen">
  <header class="brand">
    <div class="logo">⚔️</div>
    <h1>PRO GENIUS BATTLE</h1>
    <p>YOUR BATTLE. YOUR GLORY.</p>
  </header>

  <div class="card">
    <div class="tabs">
      <button id="loginTab" class="active" type="button" onclick="showAuth('login')">LOGIN</button>
      <button id="registerTab" type="button" onclick="showAuth('register')">REGISTER</button>
    </div>

    <div id="message" class="notice"></div>

    <form id="loginForm">
      <label class="field">
        <span>Email</span>
        <input id="loginEmail" type="email" required autocomplete="username" placeholder="Enter your email">
      </label>
      <label class="field">
        <span>Password</span>
        <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Enter password">
      </label>
      <button class="primary">LOGIN TO THE BATTLE →</button>
      <p class="hint">New player? Choose Register above.</p>
    </form>

    <form id="registerForm" class="hidden">
      <label class="field">
        <span>Player Username</span>
        <input id="regUsername" maxlength="24" required>
      </label>
      <label class="field">
        <span>Email</span>
        <input id="regEmail" type="email" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Create Password (minimum 8 characters)</span>
        <input id="regPassword" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label class="field">
        <span>Game</span>
        <select id="regGame">
          <option>Free Fire</option>
          <option>PUBG Mobile</option>
          <option>BGMI</option>
        </select>
      </label>
      <label class="field">
        <span>Free Fire UID / Game ID</span>
        <input id="regUid" maxlength="40" placeholder="Enter your game UID" required>
      </label>
      <label class="field">
        <span>Team Name (optional)</span>
        <input id="regTeam" maxlength="30">
      </label>
      <button class="primary">CREATE PLAYER ACCOUNT →</button>
    </form>

    <p class="hint">
      Demo version: accounts are stored only in this browser on this device.
      Do not use a real or reused password. Secure online accounts require Firebase.
    </p>
  </div>
  <p class="footer">NEON GAMING • TOURNAMENTS • COMMUNITY</p>
</section>

<section id="appScreen" class="hidden">
  <div class="topline">
    <div class="smallbrand">⚔ PRO GENIUS BATTLE</div>
    <button class="pill" type="button" onclick="logout()">LOG OUT ↗</button>
  </div>
  <div id="pageContent"></div>
</section>

</main>

<nav id="bottomNav" class="bottom hidden">
  <button data-page="home" onclick="openPage('home')">⌂ Home</button>
  <button data-page="tournaments" onclick="openPage('tournaments')">⚔ Events</button>
  <button data-page="matches" onclick="openPage('matches')">▣ Matches</button>
  <button data-page="profile" onclick="openPage('profile')">♙ Profile</button>
</nav>

<script>
const $ = id => document.getElementById(id);
let currentUser = null;

function getUsers() {
  try {
    return JSON.parse(localStorage.getItem("pgb_users") || "[]");
  } catch(e) {
    return [];
  }
}

function saveUsers(users) {
  localStorage.setItem("pgb_users", JSON.stringify(users));
}

function showMessage(text, type="error") {
  const m = $("message");
  m.textContent = text;
  m.className = "notice " + type;
}

function showAuth(which) {
  $("message").className = "notice";
  const login = which === "login";
  $("loginForm").classList.toggle("hidden", !login);
  $("registerForm").classList.toggle("hidden", login);
  $("loginTab").classList.toggle("active", login);
  $("registerTab").classList.toggle("active", !login);
}

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

function enterApp(user) {
  currentUser = user;
  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  $("bottomNav").classList.remove("hidden");
  openPage("home");
}

$("registerForm").addEventListener("submit", e => {
  e.preventDefault();

  const username = $("regUsername").value.trim();
  const email = $("regEmail").value.trim().toLowerCase();
  const password = $("regPassword").value;
  const game = $("regGame").value;
  const gameUid = $("regUid").value.trim();
  const team = $("regTeam").value.trim();

  if (password.length < 8) {
    showMessage("Password must be at least 8 characters.");
    return;
  }

  const users = getUsers();

  if (users.some(u => u.email === email)) {
    showMessage("This email is already registered. Please log in.");
    return;
  }

  const user = {
    id: Date.now(),
    username,
    email,
    password,
    game,
    gameUid,
    team,
    photo: "",
    coins: 0,
    role: "player"
  };

  users.push(user);
  saveUsers(users);

  showMessage("Account created. You can now log in.", "ok");
  $("registerForm").reset();
  showAuth("login");
  $("loginEmail").value = email;
});

$("loginForm").addEventListener("submit", e => {
  e.preventDefault();

  const email = $("loginEmail").value.trim().toLowerCase();
  const password = $("loginPassword").value;

  const user = getUsers().find(
    u => u.email === email && u.password === password
  );

  if (!user) {
    showMessage("Email or password is incorrect.");
    return;
  }

  enterApp(user);
});

function persistCurrent() {
  const users = getUsers();
  const index = users.findIndex(u => u.id === currentUser.id);

  if (index < 0) return false;

  users[index] = currentUser;
  saveUsers(users);
  return true;
}

function logout() {
  currentUser = null;
  $("appScreen").classList.add("hidden");
  $("bottomNav").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
  $("loginForm").reset();
  showAuth("login");
}

function openPage(page) {
  if (!currentUser) return;

  document.querySelectorAll(".bottom button").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });

  const c = $("pageContent");
  const name = safe(currentUser.username);

  if (page === "home") {
    c.innerHTML = `
      <div class="welcome">
        <h2>Welcome, ${name} 👋</h2>
        <p>Your next battle starts here.</p>
      </div>
      <div class="coins">
        <span>YOUR COIN BALANCE</span><br>
        <strong>🪙 ${Number(currentUser.coins || 0)}</strong>
      </div>
      <h3 class="section-title">Battle Arena</h3>
      <div class="grid">
        ${tile("⚔️","Tournaments","Free & paid events","tournaments")}
        ${tile("🎯","Matches","Upcoming matches","matches")}
        ${tile("🏆","Leaderboard","Player rankings","leaderboard")}
        ${tile("👤","Edit Profile","Update your details","profile")}
      </div>
      <div class="panel">
        <b>📢 Announcements</b>
        <p class="muted">Tournament announcements will appear here when configured.</p>
      </div>`;
  }

  else if (page === "tournaments") {
    c.innerHTML = `
      <h2>Tournaments</h2>
      <div class="panel">
        <b>🟢 Free Tournament</b>
        <p class="muted">Free entry. Event details will appear here when published.</p>
      </div>
      <div class="panel">
        <b>🟣 Paid Tournament</b>
        <p class="muted">Entry fees and prizes must be published by the organizer. Payment verification is not enabled in this demo.</p>
      </div>`;
  }

  else if (page === "matches") {
    c.innerHTML = `
      <h2>Matches</h2>
      <div class="panel">
        <b>⏳ Upcoming</b>
        <p class="muted">Match schedules will appear here when added.</p>
      </div>
      <div class="panel">
        <b>✅ Completed</b>
        <p class="muted">Results will appear here when published.</p>
      </div>`;
  }

  else if (page === "leaderboard") {
    c.innerHTML = `
      <h2>🏆 Leaderboard</h2>
      <div class="panel">Player rankings will appear here when tournament results are added.</div>`;
  }

  else if (page === "profile") {
    c.innerHTML = `
      <h2>Edit Profile</h2>
      <div class="panel">
        <img id="profilePreview" class="avatar"
          src="${currentUser.photo || ""}" alt="Profile photo"
          onerror="this.style.display='none'">

        <label class="field">
          <span>Profile Photo</span>
          <input id="editPhoto" type="file" accept="image/*">
        </label>

        <label class="field">
          <span>Username</span>
          <input id="editUsername" maxlength="24" required
            value="${safe(currentUser.username)}">
        </label>

        <label class="field">
          <span>Email (cannot be changed in this demo)</span>
          <input value="${safe(currentUser.email)}" disabled>
        </label>

        <label class="field">
          <span>Game</span>
          <select id="editGame">
            <option ${currentUser.game === "Free Fire" ? "selected" : ""}>Free Fire</option>
            <option ${currentUser.game === "PUBG Mobile" ? "selected" : ""}>PUBG Mobile</option>
            <option ${currentUser.game === "BGMI" ? "selected" : ""}>BGMI</option>
          </select>
        </label>

        <label class="field">
          <span>Free Fire UID / Game ID</span>
          <input id="editUid" maxlength="40"
            value="${safe(currentUser.gameUid || "")}">
        </label>

        <label class="field">
          <span>Team Name</span>
          <input id="editTeam" maxlength="30"
            value="${safe(currentUser.team || "")}">
        </label>

        <button class="primary" type="button" onclick="saveProfile()">SAVE CHANGES</button>
        <div id="profileMessage" class="notice"></div>
        <p class="hint">Changes are saved in this browser on this device. Choose a small photo for best results.</p>
      </div>`;
  }
}

function tile(icon, title, sub, target) {
  return `<button class="tile" onclick="openPage('${target}')">
    <span>${icon}</span><b>${title}</b><small>${sub}</small>
  </button>`;
}

function profileMessage(text, type="error") {
  const m = $("profileMessage");
  m.textContent = text;
  m.className = "notice " + type;
}

async function saveProfile() {
  if (!currentUser) return;

  const username = $("editUsername").value.trim();

  if (!username) {
    profileMessage("Username cannot be empty.");
    return;
  }

  const photoFile = $("editPhoto").files[0];
  let photo = currentUser.photo || "";

  if (photoFile) {
    if (photoFile.size > 700000) {
      profileMessage("Please choose an image smaller than 700 KB.");
      return;
    }

    photo = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(photoFile);
    });
  }

  currentUser = {
    ...currentUser,
    username,
    game: $("editGame").value,
    gameUid: $("editUid").value.trim(),
    team: $("editTeam").value.trim(),
    photo
  };

  if (!persistCurrent()) {
    profileMessage("Could not save profile. Please log in again.");
    return;
  }

  openPage("profile");
  profileMessage("Profile updated successfully!", "ok");
}
</script>
</body>
        </html>
